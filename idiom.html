<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172242">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>成語ㄚ喵</title>
<style>
:root{
  --ground:#FBFAF9;
  --surface:#FFFFFF;
  --surface-2:#F1EFEA;
  --ink:#172242;
  --ink-soft:#5A6484;
  --ink-faint:#9AA1B8;
  --line:#E2E0DA;
  --brand:#1F4FA9;
  --brand-soft:#E7EDFA;
  --mark:#FFD84D;
  --ok:#12855C;
  --ok-soft:#E2F3EB;
  --no:#C8452F;
  --no-soft:#FBE9E5;
  --btn-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(23,34,66,.06), 0 8px 24px -12px rgba(23,34,66,.18);
  --r:14px;
  --font-en:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",-apple-system,system-ui,sans-serif;
  --font-zh:-apple-system,system-ui,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --scale:1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101623;
    --surface:#18202F;
    --surface-2:#212A3B;
    --ink:#E9ECF4;
    --ink-soft:#A3ADC6;
    --ink-faint:#6B7793;
    --line:#2A3446;
    --brand:#7FA9F0;
    --brand-soft:#1E2C46;
    --mark:#F0C33C;
    --ok:#4FCB96;
    --ok-soft:#153229;
    --no:#F08A76;
    --no-soft:#38201C;
    --btn-fg:#0E1524;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#101623; --surface:#18202F; --surface-2:#212A3B;
  --ink:#E9ECF4; --ink-soft:#A3ADC6; --ink-faint:#6B7793; --line:#2A3446;
  --brand:#7FA9F0; --brand-soft:#1E2C46; --mark:#F0C33C;
  --ok:#4FCB96; --ok-soft:#153229; --no:#F08A76; --no-soft:#38201C;
  --btn-fg:#0E1524;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-zh); font-size:1rem; line-height:1.6;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}
.shell{max-width:520px; margin:0 auto; padding:0 16px 108px}
.top{
  position:sticky; top:0; z-index:20; background:var(--ground);
  padding:14px 0 10px; border-bottom:1px solid var(--line);
}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:12px}
.brandmark{display:flex; align-items:baseline; gap:8px; min-width:0}
.brandmark b{font-size:17px; font-weight:700; letter-spacing:.02em; white-space:nowrap}
.brandmark span{font-size:11px; color:var(--ink-faint); letter-spacing:.08em}
.score{font-family:var(--font-num); font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-soft); white-space:nowrap}
.score b{color:var(--ink); font-size:16px}
.bar{height:5px; border-radius:99px; background:var(--surface-2); margin-top:10px; overflow:hidden}
.bar>i{display:block; height:100%; width:0; border-radius:99px; background:var(--brand); transition:width .35s ease}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow);
}
.eyebrow{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint); font-weight:600;
}
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:15px 16px; border-radius:12px; border:1px solid transparent;
  background:var(--brand); color:var(--btn-fg); font-weight:600; font-size:16.5px;
  transition:transform .1s ease, filter .15s ease;
}
.btn:active{transform:scale(.985); filter:brightness(.94)}
.btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line); font-weight:500}
.btn.quiet{background:transparent; color:var(--ink-soft); border-color:transparent; font-size:14.5px; padding:10px}
.btn.done{background:var(--ok); color:var(--btn-fg); border-color:var(--ok); font-weight:600}
.btn:disabled{
  background:var(--surface-2); color:var(--ink-faint); border-color:var(--line);
  font-weight:500; cursor:default;
}
.btn:disabled:active{transform:none; filter:none}
.chipbox{max-height:186px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px}
.todaybox{margin:16px 0 14px; text-align:left}
.todaybox .bar{height:8px}
.todaybox .bar>i{background:linear-gradient(90deg, var(--brand), color-mix(in srgb, var(--ok) 70%, var(--brand)))}
.hero{margin-top:12px; padding:22px 18px; text-align:center}
.hero h1{margin:6px 0 4px; font-size:26px; line-height:1.25; text-wrap:balance; letter-spacing:.01em}
.hero .mark{background:linear-gradient(transparent 62%, var(--mark) 62%); padding:0 3px}
.hero p{margin:0 0 18px; color:var(--ink-soft); font-size:14.5px}
.pickers{display:flex; flex-direction:column; gap:8px; margin:16px 0}
.chiprow{display:flex; flex-wrap:wrap; gap:7px; justify-content:center}
.chip{
  padding:8px 13px; border-radius:99px; border:1px solid var(--line);
  background:var(--surface); font-size:13.5px; color:var(--ink-soft);
}
.chip[aria-pressed="true"]{background:var(--brand-soft); border-color:var(--brand); color:var(--brand); font-weight:600}
.chip:disabled{opacity:.4}
.matrix{display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
.matrix .chip{
  padding:9px 4px; border-radius:11px; text-align:center; line-height:1.3;
  display:flex; flex-direction:column; align-items:center; gap:1px;
}
.matrix .chip small{display:block; font-size:10.5px; color:var(--ink-faint); font-weight:400}
.matrix .chip[aria-pressed="true"] small{color:var(--brand)}
.toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%);
  max-width:calc(100% - 40px); z-index:50;
  padding:11px 16px; border-radius:99px; background:var(--ink); color:var(--ground);
  font-size:13.5px; box-shadow:var(--shadow); opacity:0; pointer-events:none;
  transition:opacity .25s ease;
}
.toast.on{opacity:1}
.grouphead{
  display:flex; align-items:baseline; gap:8px; margin:22px 0 8px; padding-bottom:6px;
  border-bottom:2px solid var(--ink);
}
.grouphead b{font-size:15.5px}
.grouphead span{font-size:12px; color:var(--ink-faint); font-family:var(--font-num)}
.info{border:1px solid var(--line); border-radius:11px; margin:10px 0; background:var(--surface-2)}
.info>summary{
  cursor:pointer; padding:10px 13px; font-size:13px; color:var(--ink-soft);
  display:flex; align-items:center; gap:6px; list-style:none;
}
.info>summary::-webkit-details-marker{display:none}
.info>summary::after{content:"⌄"; margin-left:auto; font-size:15px; line-height:1; transition:transform .15s}
.info[open]>summary::after{transform:rotate(180deg)}
.info .info-in{padding:0 13px 12px; font-size:12.5px; line-height:1.8; color:var(--ink-faint)}
.info .info-in b{color:var(--ink-soft)}
.segbtns{display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end}
.segbtns button{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  font-size:13px; padding:7px 12px; border-radius:9px;
}
.segbtns button[aria-pressed="true"]{
  background:var(--brand-soft); border-color:var(--brand); color:var(--brand); font-weight:700;
}
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(1.6) blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
.nav button{
  background:none; border:0; padding:10px 4px 12px; display:flex; flex-direction:column;
  align-items:center; gap:3px; font-size:11px; color:var(--ink-faint); font-weight:500;
}
.nav button em{font-style:normal; font-size:19px; line-height:1}
.nav button[aria-current="true"]{color:var(--brand); font-weight:700}
.view{display:none}
.view.on{display:block}
.foot{margin-top:26px; text-align:center; font-size:11.5px; color:var(--ink-faint); line-height:1.7}
*{box-sizing:border-box}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer}
/* ===== 成語ㄚ喵自己的 ===== */
/* 成語用系統內建的宋體／明體，不載外部字型：這頁跟單字闖關一樣，預設一個外部請求都不發 */
.zh-serif{font-family:"Songti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",var(--font-zh); font-weight:700}
.back{font-size:12.5px; color:var(--ink-faint); text-decoration:none; white-space:nowrap}
.back:hover{color:var(--ink-soft)}
.lvrow{display:grid; grid-template-columns:repeat(4,1fr); gap:7px}
.lvrow .chip{padding:9px 4px; border-radius:11px; text-align:center; line-height:1.3; display:flex; flex-direction:column; align-items:center; gap:1px}
.lvrow .chip small{font-size:10.5px; color:var(--ink-faint); font-weight:400}
.lvrow .chip[aria-pressed="true"] small{color:var(--brand)}
.wip{margin:16px 0 0; padding:14px 16px; border-radius:var(--r); background:var(--surface-2); color:var(--ink-soft); font-size:13.5px; line-height:1.7}
.wip b{color:var(--ink)}
.search{width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; margin:0 0 10px}
.lvhead{display:flex; align-items:baseline; gap:8px; margin:18px 2px 6px; font-size:12px; color:var(--ink-faint); letter-spacing:.08em}
.lvhead b{font-size:14px; color:var(--ink-soft); letter-spacing:0}
details.irow{border-bottom:1px solid var(--line)}
details.irow>summary{list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:10px; padding:11px 4px}
details.irow>summary::-webkit-details-marker{display:none}
details.irow .c{font-size:19px; letter-spacing:.12em}
details.irow .zy{font-size:12px; color:var(--ink-faint); letter-spacing:.05em; flex:1; min-width:0}
details.irow .lv{font-size:10.5px; color:var(--ink-faint); font-family:var(--font-num)}
details.irow .in{padding:0 4px 12px 4px; display:grid; gap:5px; font-size:13.5px}
details.irow .in .r{display:grid; grid-template-columns:36px 1fr; gap:8px}
details.irow .in .r b{font-weight:500; font-size:12px; color:var(--ink-faint); padding-top:2px}
details.irow .in .r .x{color:var(--no); font-weight:700}
details.irow .in .r .why{color:var(--ink-soft); font-size:12.5px}
.empty{padding:22px 0; text-align:center; color:var(--ink-faint); font-size:13.5px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
.stat{background:var(--surface-2); border-radius:11px; padding:10px 10px}
.stat b{display:block; font-size:21px; line-height:1.2; font-family:var(--font-num); font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px; color:var(--ink-soft)}
.lvbars{display:grid; gap:8px; margin-top:14px}
.lvbar{display:grid; grid-template-columns:56px 1fr 60px; gap:10px; align-items:center; font-size:13px}
.lvbar span:last-child{text-align:right; color:var(--ink-soft); font-family:var(--font-num); font-variant-numeric:tabular-nums}
.nav button[aria-disabled="true"]{opacity:.38; cursor:default}
/* ===== 答題 ===== */
.q{margin-top:16px; padding:20px 18px}
.q-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.q-kind{font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--brand); background:var(--brand-soft); padding:4px 10px; border-radius:99px}
.q-count{font-family:var(--font-num); font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-faint)}
.prompt{text-align:center; padding:6px 0 18px}
.prompt .big{font-size:34px; letter-spacing:.14em; line-height:1.3}
.prompt .zy{font-size:13px; color:var(--ink-faint); letter-spacing:.06em; margin-top:2px}
.prompt .m{font-size:19px; font-weight:600; line-height:1.5; letter-spacing:.02em}
.prompt .sen{font-size:18px; line-height:1.7; text-align:left; padding:0 4px}
.prompt .sen .blank{display:inline-block; min-width:4.4em; border-bottom:2px solid var(--brand); margin:0 3px; letter-spacing:.14em; font-weight:700; color:var(--brand); text-align:center}
.prompt .cue{font-size:13px; color:var(--ink-faint); margin-top:8px}
.choices{display:grid; gap:9px}
.choice{width:100%; text-align:left; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-size:16.5px; line-height:1.4; display:flex; align-items:center; gap:11px}
.choice i{flex:none; width:22px; height:22px; border-radius:7px; background:var(--surface-2); font-style:normal; font-size:12px; font-weight:700; color:var(--ink-faint); display:grid; place-items:center; font-family:var(--font-num)}
.choice .c4{letter-spacing:.14em; font-size:20px}
.choice.sel{background:var(--brand-soft); border-color:var(--brand); color:var(--brand); font-weight:600}
.choice.sel i{background:var(--brand); color:var(--btn-fg)}
.choice.right{background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:600}
.choice.right i{background:var(--ok); color:var(--surface)}
.choice.wrong{background:var(--no-soft); border-color:var(--no); color:var(--no)}
.choice.wrong i{background:var(--no); color:var(--surface)}
.choice:disabled{opacity:1}
.slots{display:flex; gap:8px; justify-content:center; align-items:flex-end; min-height:60px; margin-bottom:16px}
.slot{width:52px; height:56px; border-bottom:3px solid var(--ink-faint); border-radius:4px; display:grid; place-items:center; font-size:30px; background:transparent}
.slot.filled{border-bottom-color:var(--brand); background:var(--brand-soft)}
.slots.right .slot{border-bottom-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
.slots.wrong .slot{border-bottom-color:var(--no); background:var(--no-soft); color:var(--no)}
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; max-width:280px; margin:0 auto}
.tile{height:58px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); font-size:28px}
.tile:active{background:var(--brand-soft)}
.tile.used{opacity:.22; pointer-events:none}
.spellbar{display:flex; gap:8px; margin-top:30px}   /* 離字塊遠一點，避免誤按 */
.spellbar .btn{padding:12px}
.ox{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px}
.ox .btn{font-size:30px; padding:18px}
.ox .btn.sel{background:var(--brand-soft); color:var(--brand); border-color:var(--brand)}
.ox .btn.right{background:var(--ok-soft); color:var(--ok); border-color:var(--ok)}
.ox .btn.wrong{background:var(--no-soft); color:var(--no); border-color:var(--no)}
.xrow{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; max-width:300px; margin:0 auto}
.xrow .tile{height:64px; font-size:32px}
.xrow .tile.pick{border-color:var(--brand); background:var(--brand-soft); color:var(--brand)}
.xrow .tile.hit{border-color:var(--no); background:var(--no-soft); color:var(--no)}
.fb{margin-top:16px; padding:14px 15px; border-radius:12px; display:none}
.fb.on{display:block}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--no-soft)}
.fb-title{font-weight:700; font-size:15px; display:flex; align-items:center; gap:7px}
.fb.ok .fb-title{color:var(--ok)} .fb.no .fb-title{color:var(--no)}
.fb-answer{margin-top:6px; font-size:26px; letter-spacing:.14em}
.fb-zh{font-size:14.5px; color:var(--ink-soft); margin-top:2px; line-height:1.6}
.fb-use{margin:11px 0 0; padding:11px 12px; border-radius:10px; background:color-mix(in srgb, var(--surface) 75%, transparent); font-size:13.5px; line-height:1.65; color:var(--ink)}
.fb-use::before{content:attr(data-label) "　"; font-weight:700; color:var(--ink-faint); font-size:11.5px; letter-spacing:.1em}
.fb .btn{margin-top:13px}
#btnQuit{width:auto; margin:26px auto 0; padding:10px 20px}
.summary{margin-top:16px; padding:26px 20px; text-align:center}
.summary .big{font-family:var(--font-num); font-size:52px; font-weight:700; line-height:1; letter-spacing:-.02em}
.summary .big span{font-size:22px; color:var(--ink-faint)}
.summary h2{margin:14px 0 6px; font-size:20px}
.summary p{margin:0 0 18px; color:var(--ink-soft); font-size:14.5px}
.misslist{list-style:none; margin:0 0 14px; padding:0; text-align:left}
.misslist li{display:flex; align-items:baseline; gap:10px; padding:8px 2px; border-bottom:1px solid var(--line)}
.misslist .w{font-size:20px; letter-spacing:.12em}
.misslist .z{font-size:13.5px; color:var(--ink-soft); flex:1}
.weakbox{margin:0 0 16px; padding:12px; border-radius:11px; background:var(--surface-2); font-size:13.5px; text-align:left}
.weakbox .ws{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.weakbox .ws span{padding:5px 9px; border-radius:99px; background:var(--surface); border:1px solid var(--line); font-size:13px; letter-spacing:.08em}
[hidden]{display:none !important}   /* 這專案踩過三次 display:grid/flex 蓋掉 hidden 的坑，這頁直接鎖死 */

</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="top-row">
      <div class="brandmark">
        <b>成語ㄚ喵</b><a class="back" href="./">← 單字闖關</a>
      </div>
      <div class="score" id="hScore">🍖 <b id="hFeed">0</b> 顆　<span id="hStreak"></span></div>
    </div>
    <div class="bar"><i id="hBar"></i></div>
  </header>

  <!-- ================= 練習 ================= -->
  <section class="view on" id="vQuiz">
    <div class="card hero" id="startCard">
      <div class="eyebrow" id="heroVer"></div>
      <h1>看解釋<span class="mark zh-serif">拼成語</span><br>抓錯字<span class="mark zh-serif">辨用法</span></h1>
      <p id="heroSub">練成語賺飼料，飼料拿來養貓</p>

      <div class="pickers">
        <div class="eyebrow" style="text-align:left">範圍</div>
        <div class="lvrow" id="lvChips" role="group" aria-label="成語級距"></div>
        <div class="eyebrow" style="text-align:left">題數 × 難度</div>
        <div class="matrix" id="sizeRow" role="group" aria-label="題數"></div>
        <div class="matrix" id="lvRow" role="group" aria-label="難度"></div>
      </div>

      <div class="todaybox">
        <div class="goal-head"><span id="heroGoal">今天還沒練成語</span><span id="heroReward"></span></div>
        <div class="bar"><i id="heroBar"></i></div>
      </div>

      <button class="btn" id="btnStart">開始練習</button>
      <button class="btn quiet" id="btnWrongOnly">只考錯過的成語（<span id="wrongCount">0</span>）</button>
    </div>

    <div class="card q" id="qCard" hidden>
      <div class="q-head"><span class="q-kind" id="qKind"></span><span class="q-count" id="qCount"></span></div>
      <div class="prompt" id="qPrompt" aria-live="polite"></div>
      <div id="qBody"></div>
      <div class="fb" id="qFb">
        <div class="fb-title" id="fbTitle"></div>
        <div class="fb-answer zh-serif" id="fbAnswer"></div>
        <div class="fb-zh" id="fbZh"></div>
        <div class="fb-use" id="fbUse" data-label="提醒" hidden></div>
        <button class="btn" id="btnNext">下一題</button>
      </div>
      <button class="btn quiet" id="btnQuit">結束這輪</button>
    </div>

    <div class="card summary" id="sumCard" hidden>
      <div class="big"><span id="sumScore">0</span><span id="sumTotal">/0</span></div>
      <h2 id="sumTitle"></h2>
      <p id="sumText"></p>
      <ul class="misslist" id="sumMiss"></ul>
      <div class="weakbox" id="sumWeak" hidden></div>
      <button class="btn" id="btnAgain">再來一輪</button>
      <button class="btn quiet" id="btnBackHome">回主畫面</button>
    </div>
  </section>

  <!-- ================= 成語表 ================= -->
  <section class="view" id="vList">
    <div class="card" style="margin-top:12px; padding:16px 16px 6px">

["掩耳盜鈴","ㄧㄢˇ ㄦˇ ㄉㄠˋ ㄌㄧㄥˊ","自己騙自己，以為別人也不知道。","把考卷藏起來不給媽媽看，是掩耳盜鈴。",2,{x:"掩耳盜玲",xw:"「鈴」是鈴鐺，金字旁；「玲」是玲瓏的玲。",story:"有人想偷一口大鐘，鐘太重搬不動，就想敲碎它。一敲就發出巨響，他怕別人聽到，趕快把自己的耳朵摀住，以為這樣別人就聽不到了。"}],
["刻舟求劍","ㄎㄜˋ ㄓㄡ ㄑㄧㄡˊ ㄐㄧㄢˋ","死守老辦法，不知道情況已經變了。","時代不同了，用舊方法解決新問題是刻舟求劍。",2,{x:"刻舟求箭",xw:"「劍」是寶劍，掉進水裡的是劍；「箭」是弓箭的箭。",story:"有個人坐船時劍掉進河裡，他在船邊刻了記號說：「我的劍是從這裡掉下去的。」船到岸邊，他從記號處跳下水找劍，當然找不到。"}],
["拔苗助長","ㄅㄚˊ ㄇㄧㄠˊ ㄓㄨˋ ㄓㄤˇ","太急著要成果，反而把事情弄壞。","學習要慢慢來，拔苗助長只會適得其反。",2,{x:"拔苗助漲",xw:"「長」是生長；「漲」是漲價、水漲。",story:"農夫嫌禾苗長得太慢，就把每一株都往上拔高一點。他回家高興地說禾苗長高了，兒子跑去一看，禾苗全都枯死了。"}],
["自相矛盾","ㄗˋ ㄒㄧㄤ ㄇㄠˊ ㄉㄨㄣˋ","自己說的話前後衝突，講不通。","他一下說沒去，一下又說去了，根本自相矛盾。",2,{story:"有人賣矛又賣盾。他說：「我的盾最堅固，什麼都刺不穿。」又說：「我的矛最鋒利，什麼都刺得穿。」有人問：「用你的矛刺你的盾會怎樣？」他答不出來。"}],

["危言聳聽","ㄨㄟˊ ㄧㄢˊ ㄙㄨㄥˇ ㄊㄧㄥ","故意說嚇人的話，讓人害怕。","網路上很多危言聳聽的假消息。",4,{x:"危言慫聽",xw:"「聳」是使人震驚，耳字旁；「慫」是慫恿。",bad:"氣象局根據資料發布颱風警報，真是危言聳聽。",badw:"是指「故意誇大嚇人」，有根據的警告不能這樣說。"}],
["罄竹難書","ㄑㄧㄥˋ ㄓㄨˊ ㄋㄢˊ ㄕㄨ","罪行太多，用光竹子都寫不完。","那個暴君的罪行罄竹難書。",4,{x:"磬竹難書",xw:"「罄」是用盡；「磬」是樂器。",bad:"他做的好事罄竹難書，大家都很感謝他。",badw:"只能用來形容罪行、壞事很多，不能形容好事。"}],
["始作俑者","ㄕˇ ㄗㄨㄛˋ ㄩㄥˇ ㄓㄜˇ","第一個做壞事、開壞頭的人。","他是這場亂子的始作俑者。",4,{x:"始作蛹者",xw:"「俑」是陪葬的人偶，人字旁；「蛹」是昆蟲的蛹。",bad:"他是這項慈善活動的始作俑者，大家都很感謝。",badw:"帶有貶義，只能用在開壞頭的人，不能用來稱讚。"}],
["炙手可熱","ㄓˋ ㄕㄡˇ ㄎㄜˇ ㄖㄜˋ","手一靠近就覺得燙，形容權勢很大或非常搶手。","這位歌手現在炙手可熱。",4,{x:"灸手可熱",xw:"「炙」是烤，火字底；「灸」是針灸。",bad:"這道剛出爐的菜炙手可熱，小心燙口。",badw:"是形容權勢或人氣很旺，不是真的東西很燙。"}],
["美輪美奐","ㄇㄟˇ ㄌㄨㄣˊ ㄇㄟˇ ㄏㄨㄢˋ","形容建築高大華麗。","新落成的圖書館美輪美奐。",4,{x:"美倫美奐",xw:"「輪」是高大；「倫」是倫理。",bad:"她今天穿得美輪美奐。",badw:"只能形容建築物，不能形容人的打扮。"}],
["汗牛充棟","ㄏㄢˋ ㄋㄧㄡˊ ㄔㄨㄥ ㄉㄨㄥˋ","書多到搬運時牛都流汗、堆起來到屋頂，形容藏書很多。","爺爺的書房汗牛充棟。",4,{x:"汗牛充動",xw:"「棟」是屋頂的大樑；「動」是動作。",bad:"他的玩具汗牛充棟，房間都放不下。",badw:"只能形容書很多，不能形容其他東西。"}],
["巧言令色","ㄑㄧㄠˇ ㄧㄢˊ ㄌㄧㄥˋ ㄙㄜˋ","說好聽的話、裝出討好的臉色。","不要相信巧言令色的人。",4,{x:"巧言另色",xw:"「令」是美好；「另」是另外。",bad:"他巧言令色，說話非常誠懇。",badw:"是貶義，指虛偽討好，跟「誠懇」相反。"}],
["目不識丁","ㄇㄨˋ ㄅㄨˋ ㄕˋ ㄉㄧㄥ","連最簡單的字都不認識。","以前很多人目不識丁，連名字都不會寫。",4,{x:"目不識釘",xw:"「丁」是最簡單的字；「釘」是釘子。",bad:"那位教授目不識丁，學問非常淵博。",badw:"是指不識字，跟「學問淵博」矛盾。"}],
["洛陽紙貴","ㄌㄨㄛˋ ㄧㄤˊ ㄓˇ ㄍㄨㄟˋ","作品大受歡迎，大家搶著抄寫。","這本書一出版就洛陽紙貴。",4,{x:"落陽紙貴",xw:"「洛」是洛陽，地名；「落」是掉落。",bad:"最近紙價大漲，真是洛陽紙貴。",badw:"是形容作品暢銷，不是真的在說紙變貴。"}],
["明日黃花","ㄇㄧㄥˊ ㄖˋ ㄏㄨㄤˊ ㄏㄨㄚ","過了時的東西。","去年的流行款式已經是明日黃花了。",4,{x:"明日皇花",xw:"「黃」是黃色，重陽節後的菊花；「皇」是皇帝。常有人誤寫成「昨日黃花」。",bad:"這是最新流行的明日黃花，大家都在搶。",badw:"意思是「過時的東西」，不是「最新的」。"}],
["望其項背","ㄨㄤˋ ㄑㄧˊ ㄒㄧㄤˋ ㄅㄟˋ","看得到對方的脖子和背，形容追得上。","他的實力，一般人難以望其項背。",4,{x:"望其項北",xw:"「背」是背部；「北」是方向。",bad:"他太強了，我們只能望其項背。",badw:"本義是「追得上」，要表達「追不上」得說「難以望其項背」。"}],
["七月流火","ㄑㄧ ㄩㄝˋ ㄌㄧㄡˊ ㄏㄨㄛˇ","農曆七月火星西沉，天氣開始轉涼。","七月流火，早晚已經有涼意。",4,{x:"七月留火",xw:"「流」是移動；「留」是留下。",bad:"七月流火，天氣熱得要命。",badw:"意思是天氣轉涼，不是形容很熱——這是最常被誤用的成語之一。"}],
["人浮於事","ㄖㄣˊ ㄈㄨˊ ㄩˊ ㄕˋ","人比事情多，人力過剩。","公司人浮於事，很多人閒著沒事做。",4,{x:"人浮於世",xw:"「事」是工作；「世」是世界。",bad:"公司人手嚴重不足，人浮於事。",badw:"意思是人太多、事太少，跟「人手不足」相反。"}],
["文不加點","ㄨㄣˊ ㄅㄨˋ ㄐㄧㄚ ㄉㄧㄢˇ","文章一氣寫成，不用塗改。","他才思敏捷，寫作文不加點。",4,{x:"文不加典",xw:"「點」是塗改的記號；「典」是典故。",bad:"他寫文章文不加點，連一個標點符號都沒打。",badw:"「點」是塗改，不是標點符號；這是稱讚寫得快又好。"}],
["見異思遷","ㄐㄧㄢˋ ㄧˋ ㄙ ㄑㄧㄢ","看到不同的東西就改變主意。","他見異思遷，學什麼都不長久。",4,{x:"見異思牽",xw:"「遷」是改變；「牽」是牽引。",bad:"他見異思遷，十年來一直堅持同一個目標。",badw:"是指容易改變主意，跟「一直堅持」矛盾。"}],
["曲高和寡","ㄑㄩˇ ㄍㄠ ㄏㄜˋ ㄍㄨㄚˇ","曲子太高深，能跟著唱的人很少。","他的音樂曲高和寡，懂的人不多。",4,{x:"曲高合寡",xw:"「和」是跟著唱，讀ㄏㄜˋ；「合」是合作。",bad:"他的歌曲高和寡，大街小巷人人都會唱。",badw:"意思是懂的人很少，跟「人人都會唱」矛盾。"}],
["拋磚引玉","ㄆㄠ ㄓㄨㄢ ㄧㄣˇ ㄩˋ","先提出粗淺的意見，引出別人更好的看法（自謙）。","我先拋磚引玉，說說自己的想法。",4,{x:"拋磚引鈺",xw:"「玉」是美玉；「鈺」是珍寶。",bad:"感謝各位專家今天的拋磚引玉。",badw:"是自謙用語，只能說自己，不能用來稱讚別人。"}],
["蓬蓽生輝","ㄆㄥˊ ㄅㄧˋ ㄕㄥ ㄏㄨㄟ","貴客光臨讓簡陋的家增添光彩（自謙）。","您能來，真是讓寒舍蓬蓽生輝。",4,{x:"蓬壁生輝",xw:"「蓽」是荊條編的門，草字頭；「壁」是牆壁。",bad:"我今天到您家作客，真是蓬蓽生輝。",badw:"是主人自謙的話，客人不能對主人這樣說。"}],

["敬謝不敏","ㄐㄧㄥˋ ㄒㄧㄝˋ ㄅㄨˋ ㄇㄧㄣˇ","客氣地推辭，說自己能力不夠。","對於這個職位，他敬謝不敏。",4,{x:"敬謝不明",xw:"「敏」是聰敏；「明」是明白。",bad:"他對我的邀請敬謝不敏，高興地答應了。",badw:"是委婉拒絕的意思，不是答應。"}],
["一諾千金","ㄧ ㄋㄨㄛˋ ㄑㄧㄢ ㄐㄧㄣ","答應的話非常有分量，一定做到。","他一諾千金，說到做到。",4,{x:"一諾千斤",xw:"「金」是黃金，價值千金；「斤」是重量。",anti:["言而無信"],bad:"他一諾千金，答應的事從來不做。",badw:"是稱讚守信用，跟「從來不做」矛盾。"}],
["言而無信","ㄧㄢˊ ㄦˊ ㄨˊ ㄒㄧㄣˋ","說話不算數。","他言而無信，沒人再相信他。",4,{x:"言而無心",xw:"「信」是信用；「心」是心思。",anti:["一諾千金"],bad:"他言而無信，答應的事一定做到。",badw:"是指說話不算數，跟「一定做到」相反。"}],
["因噎廢食","ㄧㄣ ㄧㄝ ㄈㄟˋ ㄕˊ","因為噎到就不吃飯，比喻怕出問題就什麼都不做。","一次失敗就不再嘗試，是因噎廢食。",4,{x:"因噎費食",xw:"「廢」是停止；「費」是花費。",bad:"他因噎廢食，吃東西總是細嚼慢嚥。",badw:"是比喻，不是真的在講吃飯噎到。"}],
["杞人憂天","ㄑㄧˇ ㄖㄣˊ ㄧㄡ ㄊㄧㄢ","擔心不必要的事。","地球明天不會毀滅，別杞人憂天了。",4,{x:"杞人優天",xw:"「憂」是擔憂；「優」是優秀。",bad:"颱風快來了他還一點都不擔心，真是杞人憂天。",badw:"是指擔心不必要的事，「不擔心」不能這樣說。"}],
["緣木求魚","ㄩㄢˊ ㄇㄨˋ ㄑㄧㄡˊ ㄩˊ","爬到樹上找魚，比喻方法錯了，不可能成功。","不練習就想贏，是緣木求魚。",4,{x:"緣木求漁",xw:"「魚」是魚；「漁」是捕魚。",bad:"他拿著釣竿到河邊緣木求魚，釣到好幾條。",badw:"是比喻方法錯誤、不可能達到目的，不是真的在釣魚。"}],
["南轅北轍","ㄋㄢˊ ㄩㄢˊ ㄅㄟˇ ㄔㄜˋ","車子往南，車輪卻往北，比喻方向完全相反。","他們的想法南轅北轍，很難合作。",4,{x:"南猿北轍",xw:"「轅」是車前的橫木，車字旁；「猿」是猴子。",bad:"兩人的意見完全一致，南轅北轍。",badw:"是指相反、不一致，跟「一致」矛盾。"}],
["東施效顰","ㄉㄨㄥ ㄕ ㄒㄧㄠˋ ㄆㄧㄣˊ","盲目模仿別人，結果更難看。","模仿明星的穿著卻不適合自己，是東施效顰。",4,{x:"東施效頻",xw:"「顰」是皺眉頭；「頻」是頻率。",bad:"她東施效顰，越變越漂亮了。",badw:"是指模仿得很難看，不是變漂亮。"}],
["邯鄲學步","ㄏㄢˊ ㄉㄢ ㄒㄩㄝˊ ㄅㄨˋ","模仿別人不成，連自己原本的都忘了。","一味模仿別人，最後邯鄲學步，什麼都不會。",4,{x:"邯鄲學部",xw:"「步」是走路；「部」是部分。",bad:"他邯鄲學步，學得比老師還好。",badw:"是指學不成反而失去自己原本的，不是學得很好。"}],
["青出於藍","ㄑㄧㄥ ㄔㄨ ㄩˊ ㄌㄢˊ","學生超過老師，後人超過前人。","他的畫已經青出於藍，超過老師了。",4,{x:"青出於籃",xw:"「藍」是藍草，青色從藍草提煉；「籃」是籃子。",bad:"老師比學生厲害多了，真是青出於藍。",badw:"是指學生勝過老師，跟「老師比較厲害」相反。"}],
["班門弄斧","ㄅㄢ ㄇㄣˊ ㄋㄨㄥˋ ㄈㄨˇ","在魯班面前耍斧頭，比喻在專家面前賣弄。","在鋼琴老師面前彈琴，真是班門弄斧。",4,{x:"班門弄釜",xw:"「斧」是斧頭；「釜」是鍋子。",near:["貽笑大方"],bad:"在完全不會的新手面前表演，是班門弄斧。",badw:"要在「專家、行家」面前賣弄才叫班門弄斧，對新手不算。"}],
["貽笑大方","ㄧˊ ㄒㄧㄠˋ ㄉㄚˋ ㄈㄤ","被內行人笑話。","不懂裝懂，只會貽笑大方。",4,{x:"遺笑大方",xw:"「貽」是留給、招來，貝字旁；「遺」是遺留。",near:["班門弄斧"],bad:"他的表演精彩得貽笑大方。",badw:"是被人笑話的意思，不是稱讚精彩。"}],
["不學無術","ㄅㄨˋ ㄒㄩㄝˊ ㄨˊ ㄕㄨˋ","沒有學問也沒有本領。","他不學無術，什麼都不會。",4,{x:"不學無數",xw:"「術」是技術、本領；「數」是數目。",near:["一竅不通"],bad:"他不學無術，是全校第一名。",badw:"是指沒學問沒本領，跟「第一名」矛盾。"}],
["一竅不通","ㄧ ㄑㄧㄠˋ ㄅㄨˋ ㄊㄨㄥ","一點都不懂。","我對圍棋一竅不通。",4,{x:"一竅不同",xw:"「通」是通曉；「同」是相同。",near:["不學無術"],bad:"他對電腦一竅不通，是有名的資訊高手。",badw:"是指完全不懂，跟「高手」矛盾。"}],
["略知一二","ㄌㄩㄝˋ ㄓ ㄧ ㄦˋ","只知道一點點。","這件事我只略知一二。",4,{x:"略知一貳",xw:"「二」是數字；「貳」是大寫的二，這裡用「二」。",bad:"他對這個領域略知一二，是公認的專家。",badw:"是指只知道一點點，跟「專家」矛盾。"}],
["大智若愚","ㄉㄚˋ ㄓˋ ㄖㄨㄛˋ ㄩˊ","很有智慧的人，看起來反而像很笨。","他大智若愚，平常話不多，關鍵時刻總有好點子。",4,{x:"大智若娛",xw:"「愚」是愚笨；「娛」是娛樂。",near:["深藏不露"],bad:"他大智若愚，真的什麼都不懂。",badw:"「若」是「好像」，其實很聰明，不是真的不懂。"}],
["深藏不露","ㄕㄣ ㄘㄤˊ ㄅㄨˋ ㄌㄡˋ","有本事卻不表現出來。","他深藏不露，比賽時才讓大家嚇一跳。",4,{x:"深藏不漏",xw:"「露」是顯露；「漏」是漏水。",near:["韜光養晦","大智若愚"],anti:["鋒芒畢露"],bad:"他深藏不露，整天到處炫耀本領。",badw:"是指不表現出來，跟「炫耀」相反。"}],
["鋒芒畢露","ㄈㄥ ㄇㄤˊ ㄅㄧˋ ㄌㄡˋ","才能全部顯露出來，也指太愛表現。","他一上場就鋒芒畢露。",4,{x:"鋒芒必露",xw:"「畢」是全部；「必」是一定。",anti:["深藏不露","韜光養晦"],bad:"他鋒芒畢露，做人非常低調。",badw:"是指才能全部顯露、愛表現，跟「低調」相反。"}],
["恃才傲物","ㄕˋ ㄘㄞˊ ㄠˋ ㄨˋ","仗著有才能就看不起別人。","他恃才傲物，同學都不喜歡他。",4,{x:"侍才傲物",xw:"「恃」是依靠，心字旁；「侍」是服侍。",near:["目中無人"],anti:["虛懷若谷"],bad:"他恃才傲物，待人非常謙虛。",badw:"是指驕傲看不起人，跟「謙虛」相反。"}],

   它做完才會有這把鑰匙。所以這頁若讀不到，就用空的顯示，也不會寫回去蓋掉什麼。
   tests/idiom-shell.js 有一個測試同時開兩頁，確認兩邊讀到的是同一份。 */
const SHARED_KEY = "cq-shared-v1";
let SHARED = {days:{}, bank:{earned:0, used:0, bonus:0}, gifts:[], coupons:[]};
let sharedOK = false;                  // 讀到真的紀錄才准寫回去
function loadShared(){
  try{
    const r = JSON.parse(localStorage.getItem(SHARED_KEY));
    if(r && r.days){
      SHARED = Object.assign(SHARED, r, {
        bank:Object.assign({earned:0, used:0, bonus:0}, r.bank || {}),
        gifts:Array.isArray(r.gifts) ? r.gifts : [],
        coupons:Array.isArray(r.coupons) ? r.coupons : []
      });
      sharedOK = true;
    }
  }catch(e){}
}
function saveShared(){
  if(!sharedOK) return;                // 從沒開過單字闖關的裝置：不要憑空造一份出來
  try{ localStorage.setItem(SHARED_KEY, JSON.stringify(SHARED)); }catch(e){}
}
function dayKey(dt){
  const t = dt || new Date();
  return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
}
function streakDays(){                 // 跟單字闖關同一條：今天還沒練不算中斷
  let n = 0, t = new Date();
  if(!SHARED.days[dayKey(t)]) t.setDate(t.getDate() - 1);
  while(SHARED.days[dayKey(t)]){ n++; t.setDate(t.getDate() - 1); }
  return n;
}
function feedLeft(){                   // 飼料帳是第一階 W1，先讀著；沒有就是 0
  const f = SHARED.feed || {earned:0, used:0, bonus:0};
  return Math.max(0, (f.earned || 0) + (f.bonus || 0) - (f.used || 0));
}

/* ================= 成語的答題紀錄（跟英文題庫同一種格式） ================= */

const mastered = c => (stat(c).streak || 0) >= 2 && !(stat(c).due && stat(c).due <= dayKey());

/* ================= 獎勵：飼料 =================
   整套從單字闖關的 checkGoal 照搬，只換單位。規則的理由都寫在 README「設計取捨」：
   答對 +1 答錯 -1 → 淨題數換飼料；再乘難度與答對率倍率；一天有上限；答錯即時倒扣。
   難度倍率是「當天實際作答的平均」（mw 累加），不是切換當下的值。 */
const GAPS = [1, 3, 7, 14, 30];
function addDays(n){ const t = new Date(); t.setDate(t.getDate() + n); return dayKey(t); }
const FEED_TIERS = [{n:10, m:2}, {n:20, m:5}, {n:30, m:10}, {n:50, m:20}, {n:80, m:30}];
const FEED_CAP = FEED_TIERS[FEED_TIERS.length-1].m;   // 一天最多幾顆
const FULLGOAL = FEED_TIERS[FEED_TIERS.length-1].n;
const FEED_STREAK_EVERY = 7;                            // 連續達標幾天送一張轉蛋券
const ACC = [
  {p:.95, m:1.2, name:"幾乎全對"}, {p:.85, m:1.1, name:"很穩"}, {p:.70, m:1, name:"及格"},
  {p:.50, m:.85, name:"要小心"}, {p:0, m:.7, name:"太多錯"}
];
const netOf = d => Math.max(0, ((d||{}).r || 0) - (((d||{}).n || 0) - ((d||{}).r || 0)));
const accOf = d => (d && d.n) ? (d.r || 0) / d.n : 1;
const accStep = a => ACC.find(t=>a >= t.p) || ACC[ACC.length-1];
const accMul = d => accStep(accOf(d)).m;
function dayMul(d){ const n = (d||{}).n || 0; if(!n) return DIFF.mul; return ((d.mw === undefined ? n : d.mw) / n); }
function projMul(d, k){ const n = (d||{}).n || 0, mw = (d && d.mw !== undefined) ? d.mw : n; return (n + k) ? (mw + k * DIFF.mul) / (n + k) : DIFF.mul; }
function projAcc(d, k){ const n = (d||{}).n || 0, r = (d||{}).r || 0; return (n + k) ? (r + k) / (n + k) : 1; }
function feedTier(net){ let m = 0; for(const t of FEED_TIERS) if(net >= t.n) m = t.m; return m; }
function feedFor(net, mul){ return Math.min(FEED_CAP, Math.round(feedTier(net) * mul)); }
function dayFeed(d){ return feedFor(netOf(d), dayMul(d) * accMul(d)); }
function todayI(){ const d = SHARED.days[dayKey()]; return (d && d.i) || {n:0, r:0}; }
function nextStep(d, net){
  const t = FEED_TIERS.find(x=>net < x.n); if(!t) return null;
  const k = t.n - net; return {k, m:feedFor(t.n, projMul(d, k) * accStep(projAcc(d, k)).m)};
}
function feedStreak(){                 // 成語連續達標幾天（今天還沒達標不算中斷）；跟英文的 goalStreak 分開算
  const paid = k => { const d = SHARED.days[k]; return d && d.i && +d.i.paid > 0; };
  let n = 0, t = new Date();
  if(!paid(dayKey(t))) t.setDate(t.getDate() - 1);
  while(paid(dayKey(t))){ n++; t.setDate(t.getDate() - 1); }
  return n;
}
function feedLedger(){ return SHARED.feed || (SHARED.feed = {earned:0, used:0, bonus:0, tickets:0}); }
function checkFeed(di){
  const net = netOf(di), target = dayFeed(di), got = +di.paid || 0;
  if(target === got) return;
  const first = got === 0 && target > 0, down = target < got;
  di.paid = target;
  const F = feedLedger();
  F.earned += target - got;
  const st = first ? feedStreak() : 0;
  const ticket = first && st > 0 && st % FEED_STREAK_EVERY === 0;
  if(ticket) F.tickets = (F.tickets || 0) + 1;
  saveShared();
  const nx = nextStep(di, net);
  setTimeout(()=>{
    if(down){ toast(`⚠️ 答錯扣抵，今天剩 ${target} 顆` + (nx ? `　再答對 ${nx.k} 題可以拿回 ${nx.m} 顆` : "")); return; }
    toast(ticket ? `🎉 連續 ${st} 天達標！多一張轉蛋券，飼料共 ${feedLeft()} 顆`
                 : `🍖 淨 ${net} 題達標！今天共 ${target} 顆` + (nx ? `，再答對 ${nx.k} 題可以升到 ${nx.m} 顆` : `，飼料共 ${feedLeft()} 顆`));
  }, 900);
}

/* ================= 出題 ================= */
const KIND_LABEL = {m2c:"看解釋選成語", c2m:"看成語選解釋", syn:"近義反義", tile:"拼成語", cloze:"例句填空", wrong:"抓錯字", usage:"用法對不對"};
/* 難度只調配方，不調題數：越難，抓錯字與辨用法越多、干擾項越像。
   recog = 辨認（4-5 / 4-6 / 4-7）、build = 拼（4-1 / 4-4）、catch = 抓（4-2 / 4-3） */
const MIX = {
  easy: {recog:.6, build:.3, catch:.1},
  std:  {recog:.4, build:.4, catch:.2},
  hard: {recog:.2, build:.4, catch:.4}
};
const byC = {}; IDIOMS.forEach(i=>{ byC[i.c] = i; });
const shuffle = a => { const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const isDue = c => { const s = stat(c); return !s.due || s.due <= dayKey(); };

let pickLv = new Set([1]), pickN = 30, pickDiff = "std", DIFF = DIFFS[1];
try{
  const lv = JSON.parse(localStorage.getItem("cq-idiom-lv") || "null");
  if(Array.isArray(lv) && lv.length) pickLv = new Set(lv.filter(x=>[1,2,3,4].includes(x)));
  const nn = +localStorage.getItem("cq-idiom-n"); if(SIZES.some(z=>z.n === nn)) pickN = nn;
  const dd = localStorage.getItem("cq-idiom-diff"); if(DIFFS.some(z=>z.id === dd)){ pickDiff = dd; DIFF = DIFFS.find(z=>z.id === dd); }
}catch(e){}
function savePick(){ try{ localStorage.setItem("cq-idiom-lv", JSON.stringify([...pickLv])); localStorage.setItem("cq-idiom-n", pickN); localStorage.setItem("cq-idiom-diff", pickDiff); }catch(e){} }

const countLv = lv => IDIOMS.filter(i=>i.lv === lv).length;
function pool(){ const p = IDIOMS.filter(i=>pickLv.has(i.lv)); return p.length ? p : IDIOMS; }
function weight(i){                    // 錯得多、沒考過的優先；熟練的到複習日才回鍋
  const s = stat(i.c);
  if(s.streak >= 2) return isDue(i.c) ? 3 : 0.15;
  return 1 + s.x*3 + (s.r + s.x === 0 ? 1 : 0);
}
function pickKind(i){
  const m = MIX[pickDiff], r = Math.random();
  const group = r < m.recog ? "recog" : r < m.recog + m.build ? "build" : "catch";
  const cands = {
    recog: ["m2c", "c2m"].concat(i.near.length || i.anti.length ? ["syn"] : []),
    build: ["tile", "cloze"],
    catch: [].concat(i.x ? ["wrong"] : [], i.bad ? ["usage"] : [])
  };
  let list = cands[group];
  if(!list.length) list = cands.build;                 // 沒原料的題型退回拼字
  const last = (S.stats[i.c] || {}).k;                 // 同一個成語換輪要換題型
  const fresh = list.filter(k=>k !== last);
  const pick = fresh.length ? fresh : list;
  return pick[Math.floor(Math.random() * pick.length)];
}
function drawRound(source, size){
  const N = Math.min(size, source.length), bag = [];
  source.forEach(i=>{ const n = Math.max(1, Math.round(weight(i)*2)); for(let k=0;k<n;k++) bag.push(i); });
  const picked = [];
  for(const i of shuffle(bag)){ if(picked.length >= N) break; if(!picked.includes(i)) picked.push(i); }
  while(picked.length < N){ const i = source[Math.floor(Math.random()*source.length)]; if(!picked.includes(i)) picked.push(i); }
  return shuffle(picked).map(i=>({i, kind:pickKind(i)}));
}
/* 干擾項跟著難度走：輕鬆挑意思差很遠的（避開近義）、標準混一個近義、挑戰近義加上「有同一個字」的 */
function distractors(i, n){
  const near = i.near, avoid = new Set([i.c]);
  let pref = [];
  if(pickDiff === "std") pref = shuffle(near).slice(0, 1);
  if(pickDiff === "hard"){
    pref = shuffle(near).slice(0, 2);
    const sim = IDIOMS.filter(x=>x.c !== i.c && !near.includes(x.c) && !i.anti.includes(x.c) && [...x.c].some(ch=>i.c.includes(ch)));
    pref = pref.concat(shuffle(sim).slice(0, 1).map(x=>x.c));
  }
  const out = pref.map(c=>byC[c]); pref.forEach(c=>avoid.add(c));
  if(pickDiff === "easy") near.forEach(c=>avoid.add(c));
  for(const x of shuffle(IDIOMS)){ if(out.length >= n) break; if(avoid.has(x.c)) continue; avoid.add(x.c); out.push(x); }
  return out.slice(0, n);
}
function tileSet(i){                   // 4 個正確的字 + 4 個干擾字；有易錯字一定混進去
  const need = [...i.c], used = new Set(need), dis = [];
  if(i.x) [...i.x].forEach((ch, k)=>{ if(ch !== i.c[k] && !used.has(ch)){ used.add(ch); dis.push(ch); } });
  const rest = shuffle([...new Set(IDIOMS.flatMap(x=>[...x.c]))].filter(ch=>!used.has(ch)));
  while(dis.length < 4 && rest.length){ const ch = rest.pop(); used.add(ch); dis.push(ch); }
  return shuffle(need.concat(dis));
}

/* ================= 一輪 ================= */
let queue = [], idx = 0, roundRight = 0, missed = [], answered = false, wrongMode = false;
let sel = null, picked = [], tiles = [], xStep = 0, xPos = -1;
function save(){
  try{
    const out = {done:S.done, right:S.right, stats:{}};
    for(const k in S.stats){ const v = S.stats[k]; if(v.r || v.x) out.stats[k] = v; }
    localStorage.setItem(KEY, JSON.stringify(out));
  }catch(e){}
  saveShared();
}
function renderPickers(){
  $("lvChips").innerHTML = LEVELS.map(l=>{
    const n = countLv(l.lv);
    return `<button class="chip" data-lv="${l.lv}" aria-pressed="${pickLv.has(l.lv)}" ${n ? "" : "disabled"}>${l.name}<small>${n ? l.sub + " " + n : "還沒有"}</small></button>`;
  }).join("");
  $("lvChips").querySelectorAll("[data-lv]").forEach(b=>b.onclick = ()=>{
    const lv = +b.dataset.lv;
    if(pickLv.has(lv)){ if(pickLv.size > 1) pickLv.delete(lv); } else pickLv.add(lv);
    savePick(); renderPickers();
  });
  $("sizeRow").innerHTML = SIZES.map(z=>`<button class="chip" data-n="${z.n}" aria-pressed="${pickN === z.n}">${z.n} 題<small>${z.tag}</small></button>`).join("");
  $("sizeRow").querySelectorAll("[data-n]").forEach(b=>b.onclick = ()=>{ pickN = +b.dataset.n; savePick(); renderPickers(); });
  $("lvRow").innerHTML = DIFFS.map(d=>`<button class="chip" data-diff="${d.id}" aria-pressed="${pickDiff === d.id}">${d.name}<small>×${d.mul} 飼料</small></button>`).join("");
  $("lvRow").querySelectorAll("[data-diff]").forEach(b=>b.onclick = ()=>{
    pickDiff = b.dataset.diff; DIFF = DIFFS.find(z=>z.id === pickDiff); savePick(); renderPickers(); refreshHeader();
    toast(`難度：${DIFF.name}　${DIFF.note}　飼料 ×${DIFF.mul}`);
  });
  $("btnStart").textContent = `開始練習　${pickN} 題 · ${DIFF.name}`;
  $("wrongCount").textContent = IDIOMS.filter(i=>stat(i.c).x > 0 && stat(i.c).streak < 2).length;
}
function startRound(useWrong){
  wrongMode = !!useWrong;
  const src = wrongMode ? IDIOMS.filter(i=>stat(i.c).x > 0 && stat(i.c).streak < 2) : pool();
  if(!src.length){ toast("目前沒有錯過的成語，先做一般練習吧！"); return; }
  queue = drawRound(src, wrongMode ? Math.min(pickN, src.length) : pickN); idx = 0; roundRight = 0; missed = [];
  $("startCard").hidden = true; $("sumCard").hidden = true; $("qCard").hidden = false;
  showQ(); window.scrollTo(0,0);
}
function showQ(){
  answered = false; sel = null; picked = []; xStep = 0; xPos = -1;
  const q = queue[idx], i = q.i;
  $("qKind").textContent = KIND_LABEL[q.kind];
  $("qCount").textContent = `第 ${idx+1} / ${queue.length} 題`;
  $("qFb").className = "fb";
  const P = $("qPrompt"), B = $("qBody");
  const opt = (list, cls, html) => `<div class="choices">` + list.map((o, k)=>`<button class="choice ${cls}" data-c="${esc(o.c)}"><i>${"ABCD"[k]}</i>${html(o)}</button>`).join("") + `</div>
    <div class="spellbar"><button class="btn" id="btnCheck" disabled>檢查</button></div>`;
  const bindChoice = () => {
    B.querySelectorAll(".choice").forEach(b=>b.onclick = ()=>{
      if(answered) return;
      B.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); sel = b.dataset.c; $("btnCheck").disabled = false;
    });
    $("btnCheck").onclick = ()=>{ if(answered || sel === null) return; markChoices(i.c === sel ? sel : null, i.c); grade(sel === i.c); };
  };
  if(q.kind === "m2c"){
    P.innerHTML = `<div class="m">${esc(i.m)}</div><div class="cue">哪一個成語是這個意思？</div>`;
    B.innerHTML = opt(shuffle([i, ...distractors(i, 3)]), "", o=>`<span class="c4 zh-serif">${esc(o.c)}</span>`); bindChoice();
  }else if(q.kind === "c2m"){
    P.innerHTML = `<div class="big zh-serif">${esc(i.c)}</div><div class="zy">${esc(i.zy)}</div><div class="cue">這個成語是什麼意思？</div>`;
    B.innerHTML = opt(shuffle([i, ...distractors(i, 3)]), "", o=>esc(o.m)); bindChoice();
  }else if(q.kind === "syn"){
    const askNear = i.near.length && (!i.anti.length || Math.random() < .5);
    const ans = byC[shuffle(askNear ? i.near : i.anti)[0]];
    q.ans = ans.c; q.askNear = !!askNear;
    const avoid = new Set([i.c, ...i.near, ...i.anti]);
    let dis = [];
    if(pickDiff === "hard"){ const trap = askNear ? i.anti : i.near; if(trap.length) dis.push(byC[shuffle(trap)[0]]); }
    for(const x of shuffle(IDIOMS)){ if(dis.length >= 3) break; if(avoid.has(x.c) || dis.includes(x)) continue; dis.push(x); }
    P.innerHTML = `<div class="big zh-serif">${esc(i.c)}</div><div class="cue">哪一個是它的<b>${askNear ? "近義" : "反義"}</b>成語？</div>`;
    B.innerHTML = opt(shuffle([ans, ...dis]), "", o=>`<span class="c4 zh-serif">${esc(o.c)}</span>`);
    B.querySelectorAll(".choice").forEach(b=>b.onclick = ()=>{
      if(answered) return;
      B.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); sel = b.dataset.c; $("btnCheck").disabled = false;
    });
    $("btnCheck").onclick = ()=>{ if(answered || sel === null) return; markChoices(ans.c === sel ? sel : null, ans.c); grade(sel === ans.c); };
  }else if(q.kind === "tile" || q.kind === "cloze"){
    P.innerHTML = q.kind === "tile"
      ? `<div class="m">${esc(i.m)}</div><div class="cue">點四個字，拼出這個成語</div>`
      : `<div class="sen">${esc(i.ex).replace(esc(i.c), `<span class="blank" id="blank">　　　　</span>`)}</div><div class="cue">把空格的成語拼出來</div>`;
    tiles = tileSet(i);
    B.innerHTML = `<div class="slots" id="slots">${[0,1,2,3].map(()=>`<div class="slot"></div>`).join("")}</div>
      <div class="tiles">${tiles.map((ch, k)=>`<button class="tile zh-serif" data-k="${k}" data-ch="${esc(ch)}">${esc(ch)}</button>`).join("")}</div>
      <div class="spellbar"><button class="btn ghost" id="btnBack">← 退一格</button><button class="btn" id="btnCheck" disabled>檢查</button></div>`;
    const paint = () => {
      B.querySelectorAll(".slot").forEach((sl, k)=>{ sl.textContent = picked[k] ? picked[k].ch : ""; sl.classList.toggle("filled", !!picked[k]); });
      B.querySelectorAll(".tile").forEach(t=>t.classList.toggle("used", picked.some(p=>p.k === +t.dataset.k)));
      $("btnCheck").disabled = picked.length < 4;                 // 沒拼滿不能按
      if(q.kind === "cloze") $("blank").textContent = picked.map(p=>p.ch).join("") || "　　　　";
    };
    B.querySelectorAll(".tile").forEach(t=>t.onclick = ()=>{ if(answered || picked.length >= 4) return; picked.push({k:+t.dataset.k, ch:t.dataset.ch}); paint(); });
    $("btnBack").onclick = ()=>{ if(answered) return; picked.pop(); paint(); };
    $("btnCheck").onclick = ()=>{
      if(answered || picked.length < 4) return;
      const got = picked.map(p=>p.ch).join(""), ok = got === i.c;
      $("slots").classList.add(ok ? "right" : "wrong");
      grade(ok, got);
    };
    paint();
  }else if(q.kind === "wrong"){
    P.innerHTML = `<div class="cue">這個成語有一個字寫錯了，先點出<b>錯的那個字</b></div>`;
    B.innerHTML = `<div class="xrow" id="xrow">${[...i.x].map((ch, k)=>`<button class="tile zh-serif" data-pos="${k}">${esc(ch)}</button>`).join("")}</div><div id="xfix"></div>`;
    B.querySelectorAll("[data-pos]").forEach(b=>b.onclick = ()=>{
      if(answered || xStep !== 0) return;
      const k = +b.dataset.pos; xPos = k;
      B.querySelectorAll("[data-pos]").forEach(x=>x.classList.remove("pick")); b.classList.add("pick");
      if(i.x[k] === i.c[k]){ b.classList.add("wrong"); grade(false); return; }   // 點到對的字：這題就錯了
      xStep = 1; b.classList.add("hit");
      const wrongCh = i.x[k], rightCh = i.c[k];
      const cand = shuffle([...new Set(IDIOMS.flatMap(x=>[...x.c]))].filter(ch=>ch !== wrongCh && ch !== rightCh)).slice(0, 1);
      const opts = shuffle([rightCh, wrongCh, ...cand]);
      $("xfix").innerHTML = `<div class="cue" style="margin:16px 0 8px">正確的字是哪一個？</div><div class="xrow">${opts.map(ch=>`<button class="tile zh-serif" data-fix="${esc(ch)}">${esc(ch)}</button>`).join("")}</div>`;
      $("xfix").querySelectorAll("[data-fix]").forEach(f=>f.onclick = ()=>{
        if(answered) return;
        const ok = f.dataset.fix === rightCh;
        f.classList.add(ok ? "pick" : "hit");
        grade(ok);
      });
    });
  }else if(q.kind === "usage"){
    const useBad = Math.random() < .5;
    q.sent = useBad ? i.bad : i.ex; q.right = !useBad;
    P.innerHTML = `<div class="sen">${esc(q.sent)}</div><div class="cue">這句話裡的「${esc(i.c)}」用得對嗎？</div>`;
    B.innerHTML = `<div class="ox"><button class="btn ghost" id="btnO" aria-label="用得對">○</button><button class="btn ghost" id="btnX" aria-label="用錯了">✕</button></div>`;
    const pickOX = v => { if(answered) return; const ok = v === q.right; $(v ? "btnO" : "btnX").classList.add(ok ? "right" : "wrong"); if(!ok) $(q.right ? "btnO" : "btnX").classList.add("right"); grade(ok); };
    $("btnO").onclick = ()=>pickOX(true); $("btnX").onclick = ()=>pickOX(false);
  }
  $("btnNext").textContent = idx + 1 >= queue.length ? "看本輪成績" : "下一題";
}
function markChoices(selC, ansC){
  $("qBody").querySelectorAll(".choice").forEach(b=>{
    b.disabled = true;
    if(b.dataset.c === ansC) b.classList.add("right");
    else if(b.classList.contains("sel")) b.classList.add("wrong");
  });
}
function grade(ok, got){
  answered = true;
  const q = queue[idx], i = q.i, s = S.stats[i.c] || (S.stats[i.c] = {r:0, x:0, streak:0});
  if(ok){ s.r++; s.streak++; roundRight++; S.right++; s.due = addDays(GAPS[Math.min(s.streak - 1, GAPS.length - 1)]); }
  else{ s.x++; s.streak = 0; s.due = dayKey(); missed.push(i); }
  s.k = q.kind; S.done++;
  const dk = dayKey(), day = SHARED.days[dk] || (SHARED.days[dk] = {n:0, r:0});
  const di = day.i || (day.i = {n:0, r:0});
  const mw = (di.mw === undefined ? di.n : di.mw) + DIFF.mul;   // 難度倍率累加，之後除以題數才是當天平均
  di.n++; if(ok) di.r++; di.mw = Math.round(mw * 100) / 100;
  checkFeed(di);
  save(); refreshHeader();

  const fb = $("qFb");
  fb.className = "fb on " + (ok ? "ok" : "no");
  $("fbTitle").textContent = ok ? "✓ 答對了！" : "✗ 再記一次";
  $("fbAnswer").textContent = i.c;
  $("fbZh").textContent = i.zy + "　" + i.m;
  let note = "", label = "提醒";
  if(!ok && q.kind === "usage" && !q.right){ note = i.badw; label = "為什麼錯"; }
  else if(!ok && (q.kind === "wrong" || (got && i.x && got === i.x))){ note = i.xw; label = "易錯字"; }
  else if(!ok && i.x && q.kind !== "usage"){ note = `常見錯字：${i.x}。${i.xw}`; label = "易錯字"; }
  else if(!ok) note = `例句：${i.ex}`;
  $("fbUse").hidden = !note; $("fbUse").textContent = note; $("fbUse").dataset.label = label;
  fb.scrollIntoView({behavior:"smooth", block:"nearest"});
}
$("btnNext").onclick = ()=>{ idx++; if(idx >= queue.length) endRound(); else { showQ(); window.scrollTo({top:0, behavior:"smooth"}); } };
function roundDone(){ return Math.min(idx + (answered ? 1 : 0), queue.length); }
function endRound(){
  $("qCard").hidden = true; $("sumCard").hidden = false;
  const total = roundDone(), pct = total ? roundRight / total : 0;
  $("sumScore").textContent = roundRight; $("sumTotal").textContent = "/" + total;
  $("sumTitle").textContent = !total ? "這輪還沒作答" : pct === 1 ? "全對！太厲害了 🎉" : pct >= .8 ? "很不錯，快滿分了" : pct >= .5 ? "有進步空間，再來一輪" : "先看看下面這幾個成語";
  const di = todayI(), net = netOf(di), nx = nextStep(di, net);
  $("sumText").textContent = (total && total < queue.length ? `這輪提早結束，只算答過的 ${total} 題　·　` : "")
    + `今天淨 ${net} 題 · ${+di.paid || 0} 顆飼料` + (nx ? `　再答對 ${nx.k} 題 → ${nx.m} 顆` : "　今日上限已滿 ✓")
    + (sharedOK ? "" : "　·　⚠️ 這台還沒開過單字闖關，飼料要開過一次才存得住");
  $("sumMiss").innerHTML = missed.length
    ? missed.map(i=>`<li><span class="w zh-serif">${esc(i.c)}</span><span class="z">${esc(i.m)}</span></li>`).join("")
    : `<li><span class="z">這一輪沒有錯 👏</span></li>`;
  const weak = IDIOMS.filter(i=>stat(i.c).x > 0 && stat(i.c).streak < 2).sort((a,b)=>stat(b.c).x - stat(a.c).x);
  $("sumWeak").hidden = !weak.length;
  $("sumWeak").innerHTML = weak.length ? `<b>還要加強 ${weak.length} 條　連對 2 次就畢業</b><div class="ws">${weak.slice(0, 12).map(i=>`<span class="zh-serif">${esc(i.c)}</span>`).join("")}${weak.length > 12 ? `<em>… 還有 ${weak.length - 12} 條</em>` : ""}</div>` : "";
  renderPickers();
  window.scrollTo(0,0);
}
$("btnStart").onclick = ()=>startRound(false);
$("btnWrongOnly").onclick = ()=>startRound(true);
$("btnAgain").onclick = ()=>startRound(wrongMode);
$("btnBackHome").onclick = ()=>{ $("sumCard").hidden = true; $("startCard").hidden = false; renderPickers(); refreshHeader(); window.scrollTo(0,0); };
$("btnQuit").onclick = ()=>{
  const n = roundDone();
  if(n < queue.length){
    const msg = n ? `要提早結束這一輪嗎？\n已答的 ${n} 題會照算。` : "還沒作答，要結束這一輪嗎？";
    if(!confirm(msg)) return;
  }
  endRound();
};

/* ================= 成語表 ================= */
function renderList(){
  const q = ($("search").value || "").trim();
  const hit = IDIOMS.filter(i => !q || i.c.includes(q) || i.zy.includes(q) || i.m.includes(q));
  if(!hit.length){ $("listBody").innerHTML = `<div class="empty">找不到「${esc(q)}」</div>`; return; }
  let html = "";
  LEVELS.forEach(l=>{
    const rows = hit.filter(i=>i.lv === l.lv);
    if(!rows.length) return;
    html += `<div class="lvhead"><b>${l.name}</b>${l.sub} · ${rows.length} 條</div>`;
    html += rows.map(i=>`<details class="irow">
      <summary><span class="c zh-serif">${esc(i.c)}</span><span class="zy">${esc(i.zy)}</span>${mastered(i.c) ? `<span class="lv">✓ 熟練</span>` : ""}</summary>
      <div class="in">
        <div class="r"><b>解釋</b><span>${esc(i.m)}</span></div>
        <div class="r"><b>例句</b><span>${esc(i.ex)}</span></div>
        ${i.x ? `<div class="r"><b>易錯</b><span><span class="x">${esc(i.x)}</span>　<span class="why">${esc(i.xw || "")}</span></span></div>` : ""}
        ${i.near.length ? `<div class="r"><b>近義</b><span>${i.near.map(esc).join("、")}</span></div>` : ""}
        ${i.anti.length ? `<div class="r"><b>反義</b><span>${i.anti.map(esc).join("、")}</span></div>` : ""}
      </div></details>`).join("");
  });
  $("listBody").innerHTML = html;
}
$("search").addEventListener("input", renderList);

/* ================= 進度 ================= */
function renderStats(){
  $("stFeed").textContent = feedLeft();
  $("stStreak").textContent = streakDays();
  $("stMastered").textContent = IDIOMS.filter(i=>mastered(i.c)).length;
  $("lvBars").innerHTML = LEVELS.map(l=>{
    const all = countLv(l.lv), m = IDIOMS.filter(i=>i.lv === l.lv && mastered(i.c)).length;
    return `<div class="lvbar"><span>${l.name}</span><div class="bar" style="margin:0"><i style="width:${all ? m/all*100 : 0}%"></i></div><span>${m} / ${all || "—"}</span></div>`;
  }).join("");
}

/* ================= 頂端 ================= */
function refreshHeader(){
  const st = streakDays(), di = todayI(), net = netOf(di), nx = nextStep(di, net);
  $("hFeed").textContent = feedLeft();
  $("hStreak").textContent = nx ? `再答對 ${nx.k} 題 → ${nx.m} 顆` : "今日上限已滿 ✓";
  $("hBar").style.width = Math.min(100, net / FULLGOAL * 100) + "%";
  $("heroGoal").textContent = di.n ? `今天對 ${di.r || 0}、錯 ${di.n - (di.r || 0)}、淨 ${net} 題` : "今天還沒練成語";
  $("heroReward").textContent = (+di.paid || 0) ? `${di.paid} 顆` : "";
  $("heroBar").style.width = Math.min(100, net / FULLGOAL * 100) + "%";
  document.querySelectorAll(".stat b#stStreak").forEach(b=>b.textContent = st);
}

/* ================= 顯示設定：跟單字闖關讀同一組鑰匙，小孩在那邊選的字級配色這邊照用 ================= */
(function initDisplay(){
  let s = "1", t = "auto";
  try{ s = localStorage.getItem("cq-scale") || "1"; t = localStorage.getItem("cq-theme") || "auto"; }catch(e){}
  document.documentElement.style.setProperty("--scale", s);
  if(t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
})();

/* ================= 啟動 ================= */
loadShared(); loadS();
$("heroVer").textContent = "版本 " + IDIOM_VERSION;
$("verline").textContent = "成語ㄚ喵 · 版本 " + IDIOM_VERSION + " · 題庫 " + IDIOMS.length + " 條";
renderPickers(); refreshHeader(); renderList(); renderStats();

/* ================= 離線（service worker） =================
   註冊的是同一支 sw.js（同一個 scope），所以裝成 App 之後兩頁互跳都在同一個殼裡。 */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
